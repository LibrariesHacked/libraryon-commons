name: Directory Health & Verification

on:
  schedule:
    # Run daily at 04:00 UTC
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health-check:
    name: Directory Health Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: npm
      - run: npm ci
      - name: Run Directory Verification & Link Check
        run: npm run directory:check -- --live
      - name: Export JSON Audit Report
        if: always()
        run: node scripts/directory/check-directory.mjs --json > directory-health-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: directory-health-report
          path: directory-health-report.json
