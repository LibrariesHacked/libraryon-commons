name: Sync Public Libraries News

on:
  schedule:
    # Run weekly on Monday at 02:00 UTC (following PLN Sunday night scrapes)
    - cron: '0 2 * * 1'
  workflow_dispatch:
  repository_dispatch:
    types: [news-updated]

permissions:
  contents: write

jobs:
  sync:
    name: Sync News Data
    runs-on: ubuntu-latest
    steps:
      - name: Checkout LibraryCommons
        uses: actions/checkout@v4

      - name: Checkout Public Libraries News archive
        uses: actions/checkout@v4
        with:
          repository: LibrariesHacked/public-libraries-news
          path: public-libraries-news

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Ingest and index latest news stories
        env:
          PLN_DATA_DIR: public-libraries-news/data/stories
        run: npm run sync:news

      - name: Run test suite
        run: npm test

      - name: Commit and push news updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/news/
          if git diff --staged --quiet; then
            echo "No new PLN news updates detected."
          else
            git commit -m "chore(news): sync latest Public Libraries News stories"
            git push
          fi
