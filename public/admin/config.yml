  - name: pages
    label: Editorial Content
    label_singular: Page
    folder: src/content/pages
    create: true
    extension: md
    format: frontmatter
    slug: '{{slug}}'
    identifier_field: title
    summary: '{{title}} ({{kind}})'
    view_groups:
      - label: Content Type
        field: kind
    view_filters:
      - label: Collection Articles
        field: kind
        pattern: collection
      - label: Case Studies
        field: kind
        pattern: case-study
      - label: Conferences
        field: kind
        pattern: conference
      - label: Grants
        field: path
        pattern: ^/grants
      - label: Policies And Legal
        field: path
        pattern: ^/legal/
    editor:
      preview: false
    fields:
      - name: title
        label: Title
        widget: string
      - name: path
        label: Site Path
        widget: string
        pattern:
          - ^/(?:[A-Za-z0-9_-]+/)*[A-Za-z0-9_-]*$
          - Use an absolute site path, such as /about/pressplay.
      - name: kind
        label: Page Type
        widget: select
        options:
          - label: Standard Page
            value: page
          - label: Article
            value: article
          - label: Landing Page
            value: landing
          - label: Collection Article
            value: collection
          - label: Case Study
            value: case-study
          - label: Grants Programme
            value: grant
          - label: Conference Page
            value: conference
          - label: Legal Or Policy Page
            value: legal
        default: page
      - name: content_origin
        label: Content Origin
        widget: select
        options:
          - label: Original LibraryOn Content
            value: libraryon
          - label: New Commons Content
            value: commons
        required: false
        hint: Existing LibraryOn source URLs are recognized automatically; set this explicitly for new pages that cite LibraryOn.
      - name: published
        label: Publish on site
        widget: boolean
        default: true
        required: false
        hint: Turn off to keep this entry in the CMS without generating a public page.
      - name: description
        label: Summary
        widget: text
        required: false
      - name: author
        label: Author Or Contributor
        widget: string
        required: false
      - name: contributors
        label: Contributor Profiles
        widget: relation
        collection: contributors
        search_fields:
          - name
        value_field: '{{slug}}'
        display_fields:
          - name
        multiple: true
        required: false
      - name: published_on
        label: Publication Date
        widget: datetime
        format: YYYY-MM-DD
        date_format: YYYY-MM-DD
        time_format: false
        required: false
      - name: updated_on
        label: Updated Date
        widget: datetime
        format: YYYY-MM-DD
        date_format: YYYY-MM-DD
        time_format: false
        hint: Set automatically each time this page is saved.
        required: false
      - name: source_url
        label: Original Source URL
        widget: string
        required: false
      - name: attribution
        label: Credits And Attribution
        widget: text
        required: false
      - name: hero
        label: Lead Image
        widget: object
        required: false
        fields: &a1
          - name: image
            label: Image
            widget: image
          - name: alt
            label: Alternative Text
            widget: string
          - name: caption
            label: Caption
            widget: string
            required: false
          - name: credit
            label: Credit
            widget: string
            required: false
      - name: body
        label: Content
        widget: markdown
      - name: faqs
        label: Frequently Asked Questions
        widget: list
        required: false
        summary: '{{fields.question}}'
        fields:
          - name: question
            label: Question
            widget: string
          - name: answer
            label: Answer
            widget: text
      - name: gallery
        label: Gallery Or Slides
        widget: list
        required: false
        summary: '{{fields.alt}}'
        fields: *a1
      - name: resources
        label: Related Resources
        widget: relation
        collection: resources
        search_fields:
          - title
        value_field: '{{slug}}'
        display_fields:
          - title
        multiple: true
        required: false
  - name: resources
    label: Resources And Downloads
    label_singular: Resource
    folder: src/content/resources
    create: true
    extension: json
    format: json
    slug: '{{slug}}'
    summary: '{{title}} ({{kind}})'
    editor:
      preview: false
    fields:
      - name: title
        label: Title
        widget: string
      - name: kind
        label: Resource Type
        widget: select
        options:
          - document
          - slides
          - recording
          - link
      - name: url
        label: File Or External URL
        widget: file
        hint: Upload a local document, or enter the external presentation or recording URL.
      - name: description
        label: Description
        widget: text
        required: false
      - name: source_url
        label: Original Source URL
        widget: string
        required: false
      - name: credit
        label: Credit
        widget: text
        required: false
      - name: licence
        label: Rights Or Licence
        widget: string
        required: false
      - name: updated_on
        label: Updated Date
        widget: datetime
        format: YYYY-MM-DD
        date_format: YYYY-MM-DD
        time_format: false
        hint: Set automatically each time this resource is saved.
        required: false
  - name: sessions
    label: Conference Sessions
    label_singular: Session
    folder: src/content/sessions
    create: true
    extension: json
    format: json
    slug: '{{slug}}'
    summary: '{{title}}'
    editor:
      preview: false
    fields:
      - name: title
        label: Session Title
        widget: string
      - name: conference
        label: Conference Page
        widget: relation
        collection: pages
        search_fields:
          - title
        value_field: '{{slug}}'
        display_fields:
          - title
        filters:
          - field: kind
            values:
              - conference
      - name: theme
        label: Theme
        widget: string
        required: false
      - name: order
        label: Display Order
        widget: number
        value_type: int
        min: 0
        default: 0
      - name: description
        label: Description
        widget: markdown
        required: false
      - name: speakers
        label: Speakers
        widget: list
        required: false
        fields:
          - name: name
            label: Name
            widget: string
          - name: organisation
            label: Organisation
            widget: string
            required: false
      - name: resources
        label: Slides And Recordings
        widget: relation
        collection: resources
        search_fields:
          - title
        value_field: '{{slug}}'
        display_fields:
          - title
        multiple: true
        required: false
      - name: updated_on
        label: Updated Date
        widget: datetime
        format: YYYY-MM-DD
        date_format: YYYY-MM-DD
        time_format: false
        hint: Set automatically each time this session is saved.
        required: false
  - name: authorities
    label: Library Authorities
    label_singular: Authority
    folder: src/content/authorities
    create: true
    extension: json
    format: json
    slug: '{{fields.slug}}'
    identifier_field: name
    summary: '{{name}} ({{country}})'
    sortable_fields:
      - name
      - country
      - reviewed_on
    editor:
      preview: false
    fields:
      - name: name
        label: Authority Name
        widget: string
      - name: slug
        label: URL Slug
        widget: string
        pattern:
          - ^[A-Za-z0-9][A-Za-z0-9-]*$
          - Use letters, numbers and hyphens; keep existing slugs unchanged.
      - name: id
        widget: hidden
        required: false
      - name: source_id
        widget: hidden
        required: false
      - name: authorityID
        label: Stable Authority ID
        widget: string
        required: false
      - name: country
        label: Country
        widget: select
        options:
          - England
          - Scotland
          - Wales
          - Northern Ireland
          - Crown Dependencies
        required: false
      - name: website
        label: Official Website
        widget: string
        required: false
      - name: phone
        label: Phone
        widget: string
        required: false
      - name: email
        label: Email
        widget: string
        required: false
      - name: about
        label: About The Service
        widget: text
        required: false
      - name: catalogue
        label: Catalogue URL
        widget: string
        required: false
      - name: joinOnline
        label: Join Online URL
        widget: string
        required: false
      - name: androidApp
        label: Android App
        widget: string
        required: false
      - name: iOSApp
        label: iOS App
        widget: string
        required: false
      - name: gss
        label: GSS Code
        widget: string
        required: false
      - name: operatingOrganisation
        label: Operating Organisation
        widget: string
        required: false
      - name: source_url
        label: Original Source URL
        widget: string
        required: false
      - name: imported_on
        label: Imported On
        widget: hidden
        required: false
      - name: createdAt
        widget: hidden
        required: false
      - name: updatedAt
        widget: hidden
        required: false
      - name: updated_on
        label: Last Updated
        widget: datetime
        date_format: YYYY-MM-DD
        time_format: false
        format: YYYY-MM-DD
        hint: Set automatically each time this authority is saved.
        required: false
