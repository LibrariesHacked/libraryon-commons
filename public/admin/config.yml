    fields:
      - name: title
        label: Title
        widget: string
      - name: kind
        label: Resource Type
        widget: select
        options:
          - document
          - slides
          - recording
          - link
      - name: url
        label: File Or External URL
        widget: file
        hint: Upload a local document, or enter the external presentation or recording URL.
      - name: description
        label: Description
        widget: text
        required: false
      - name: source_url
        label: Original Source URL
        widget: string
        required: false
      - name: credit
        label: Credit
        widget: text
        required: false
      - name: licence
        label: Rights Or Licence
        widget: string
        required: false
      - name: updated_on
        label: Updated Date
        widget: datetime
        format: YYYY-MM-DD
        date_format: YYYY-MM-DD
        time_format: false
        hint: Set automatically each time this resource is saved.
        required: false
  - name: sessions
    label: Conference Sessions
    label_singular: Session
    folder: src/content/sessions
    create: true
