  - name: pages
    label: Editorial Content
    label_singular: Page
    folder: src/content/pages
    create: true
    extension: md
    format: frontmatter
    slug: '{{slug}}'
    identifier_field: title
    summary: '{{title}} ({{kind}})'
    view_groups:
      - label: Content Type
        field: kind
    view_filters:
      - label: Collection Articles
        field: kind
        pattern: collection
      - label: Case Studies
        field: kind
        pattern: case-study
      - label: Conferences
        field: kind
        pattern: conference
      - label: Grants
        field: path
        pattern: ^/grants
      - label: Policies And Legal
        field: path
        pattern: ^/legal/
    editor:
      preview: false
    fields:
      - name: title
        label: Title
        widget: string
      - name: path
        label: Site Path
        widget: string
        pattern:
          - ^/(?:[A-Za-z0-9_-]+/)*[A-Za-z0-9_-]*$
          - Use an absolute site path. Published parent pages create sitemap and breadcrumb links; add a redirect when changing a live path.
      - name: kind
        label: Page Type
        widget: select
        options:
          - label: Standard Page
            value: page
          - label: Article
            value: article
          - label: Landing Page
            value: landing
          - label: Collection Article
            value: collection
          - label: Case Study
            value: case-study
          - label: Grants Programme
            value: grant
          - label: Conference Page
            value: conference
          - label: Legal Or Policy Page
            value: legal
        default: page
      - name: content_origin
        label: Content Origin
        widget: select
        options:
          - label: Original LibraryOn Content
            value: libraryon
          - label: New Commons Content
            value: commons
        required: false
        hint: Existing LibraryOn source URLs are recognized automatically; set this explicitly for new pages that cite LibraryOn.
      - name: published
        label: Publish on site
        widget: boolean
        default: true
        required: false
        hint: Turn off to keep this entry in the CMS without generating a public page.
      - name: description
        label: Summary
        widget: text
        required: false
      - name: author
        label: Author Or Contributor
        widget: string
        required: false
      - name: contributors
        label: Contributor Profiles
        widget: relation
        collection: contributors
        search_fields:
          - name
        value_field: '{{slug}}'
        display_fields:
          - name
        multiple: true
        required: false
      - name: published_on
        label: Publication Date
        widget: datetime
        format: YYYY-MM-DD
        date_format: YYYY-MM-DD
        time_format: false
        required: false
      - name: updated_on
        label: Updated Date
        widget: datetime
        format: YYYY-MM-DD
        date_format: YYYY-MM-DD
        time_format: false
        hint: Set automatically each time this page is saved.
        required: false
      - name: source_url
        label: Original Source URL
        widget: string
        required: false
      - name: attribution
        label: Credits And Attribution
        widget: text
        required: false
      - name: hero
        label: Lead Image
        widget: object
        required: false
        fields: &a1
          - name: image
            label: Image
            widget: image
          - name: alt
            label: Alternative Text
            widget: string
          - name: caption
            label: Caption
            widget: string
            required: false
          - name: credit
            label: Credit
            widget: string
            required: false
      - name: body
        label: Content
        widget: markdown
        modes: [rich_text, raw]
        editor_components:
          - library-testimonial
          - library-quote
          - library-cards
          - library-card
          - library-list-panel
          - library-video
          - library-collection-image
          - library-collection-carousel
          - library-collection-accordion
          - library-collection-aside
          - library-collection-recommendations
          - library-faqs
          - library-resources
          - image
          - code-block
        hint: 'Use the + menu for content blocks. Collection carousels and book recommendations keep all slides, notes, and entries inline in this Markdown body. Select FAQ and resource entries in their page fields.'
      - name: faq_heading
        label: FAQ Section Heading
        widget: string
        required: false
        hint: Match the heading immediately before the {{faqs}} marker to include that heading and its introduction in the FAQ component.
      - name: faqs
        label: Frequently Asked Questions
        widget: relation
        collection: faqs
        search_fields:
          - question
        value_field: '{{slug}}'
        display_fields:
          - question
        multiple: true
        required: false
        hint: Select reusable questions in display order. Edit answers in Frequently Asked Questions.
      - name: gallery
        label: Gallery Or Slides
        widget: list
        required: false
        summary: '{{fields.alt}}'
        fields: *a1
      - name: resources
        label: Related Resources
        widget: relation
        collection: resources
        search_fields:
          - title
        value_field: '{{slug}}'
        display_fields:
          - title
        multiple: true
        required: false
      - name: child_pages
        label: Subpages
        widget: relation
        collection: pages
        search_fields:
          - title
        value_field: path
        display_fields:
          - title
        multiple: true
        required: false
        hint: Select and order the cards shown on this landing page. Child paths, not this list, determine sitemap nesting and breadcrumbs.
  - name: faqs
    label: Frequently Asked Questions
    label_singular: FAQ
    folder: src/content/faqs
